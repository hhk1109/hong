<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小黄人登录 · Minion Login</title>
<style>
  :root{
    --minion-yellow:#FFD90F;
    --minion-yellow-dark:#F5C400;
    --minion-blue:#3B6FE0;
    --minion-blue-dark:#2A55B8;
    --ink:#3A3A3A;
    --soft:#7A7A7A;
    --banana:#FFE04B;
    --banana-dark:#DFAE0B;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:linear-gradient(160deg,#FFE873 0%,#FFD90F 55%,#F2BD00 100%)}
  body{
    font-family:"Comic Sans MS","Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(160deg,#FFE873 0%,#FFD90F 55%,#F2BD00 100%);
    background-attachment:fixed;
    overflow:hidden;
    position:relative;
  }

  /* ==================== 背景香蕉墙（真实香蕉照片平铺） ==================== */
  .banana-lattice{
    position:absolute;inset:0;width:100%;height:100%;
    z-index:0;pointer-events:none;display:block;
  }

  /* ==================== 背景飘动香蕉（34 片照片抠图） ==================== */
  .banana-field{position:absolute;inset:0;overflow:hidden;z-index:1;pointer-events:none}
  .floaty{
    position:absolute;width:auto;user-select:none;pointer-events:none;
    transform-origin:center;
    animation-name:bananaFloat;
    animation-timing-function:ease-in-out;
    animation-iteration-count:infinite;
    will-change:transform;
    filter:drop-shadow(0 6px 8px rgba(120,90,0,.18));
  }
  @keyframes bananaFloat{
    0%   {transform:translate3d(0,0,0) rotate(var(--rot,0deg))}
    50%  {transform:translate3d(var(--sway,10px),calc(var(--rise,22px) * -1),0) rotate(calc(var(--rot,0deg) + 14deg))}
    100% {transform:translate3d(0,0,0) rotate(var(--rot,0deg))}
  }

  /* ==================== 登录卡片 ==================== */
  .card{
    position:relative;
    width:380px;
    max-width:92vw;
    background:#fff;
    border-radius:32px;
    padding:0 0 30px;
    box-shadow:0 24px 60px rgba(120,90,0,.32), 0 0 0 6px rgba(255,255,255,.35);
    z-index:2;
    overflow:hidden;
    animation:pop .6s cubic-bezier(.2,1.2,.4,1) both;
  }
  @keyframes pop{from{opacity:0;transform:translateY(40px) scale(.92)}to{opacity:1;transform:none}}

  /* 头部用浅色渐变：白底剧照 multiply 混合后无缝融入 */
  .card-top{
    background:radial-gradient(circle at 50% 30%, #FFFDF4 0%, #FFF7D6 62%, #FFEFAD 100%);
    padding:22px 0 16px;
    text-align:center;
    position:relative;
  }
  .card-top::after{
    content:"";position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);
    width:108%;height:32px;background:var(--minion-yellow);
    border-radius:50%;
  }

  /* ---------- 小黄人剧照（Bob 抱泰迪熊） ---------- */
  .minion-stage{display:flex;justify-content:center}
  /* 注意：不要加 filter，drop-shadow 会让 mix-blend-mode 失效 */
  .minion-photo{
    width:168px;height:auto;display:block;
    mix-blend-mode:multiply;
    animation:bob 4s ease-in-out infinite;
    user-select:none;-webkit-user-drag:none;
  }
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
  .minion-stage:hover .minion-photo{animation-play-state:paused}

  .title{
    text-align:center;
    margin:20px 0 4px;
    color:var(--ink);
    font-size:1.5rem;
    letter-spacing:1px;
  }
  .subtitle{
    text-align:center;color:var(--soft);
    font-size:.9rem;margin-bottom:18px;
  }
  .subtitle b{color:var(--minion-blue-dark)}

  form{padding:0 30px}
  .field{
    position:relative;margin-bottom:16px;
  }
  .field input{
    width:100%;
    padding:14px 72px 14px 16px;
    border:2px solid #ECECEC;
    border-radius:16px;
    font-size:1rem;
    color:var(--ink);
    background:#FBFBFB;
    transition:border-color .2s, box-shadow .2s;
    outline:none;
    font-family:inherit;
  }
  .field input:focus{
    border-color:var(--minion-yellow);
    box-shadow:0 0 0 4px rgba(255,217,15,.25);
    background:#fff;
  }
  .field input[aria-invalid="true"]{
    border-color:#F0A3A3;background:#FFFAFA;
  }
  .field .icon{
    position:absolute;right:14px;top:22px;transform:translateY(-50%);
    font-size:1.2rem;cursor:pointer;user-select:none;
  }
  .toggle-pass:hover{transform:translateY(-50%) scale(1.15)}

  /* 字数计数器 */
  .counter{
    position:absolute;right:46px;top:22px;transform:translateY(-50%);
    font-size:.72rem;color:#B9B9B9;pointer-events:none;letter-spacing:.5px;
  }
  .counter.warn{color:#E8A33D}

  .error{color:#E05B5B;font-size:.78rem;margin:6px 4px 0}

  /* ---------- 验证码 ---------- */
  .captcha-row{display:flex;align-items:flex-start;gap:10px}
  .captcha-input-wrap{flex:1 1 auto;min-width:0;margin-bottom:16px}
  .captcha-input-wrap input{padding:14px 16px;letter-spacing:3px;text-transform:uppercase}
  .captcha{position:relative;flex:0 0 auto;margin-top:2px}
  .captcha-canvas{
    display:block;border-radius:12px;border:2px solid #ECECEC;cursor:pointer;
    transition:border-color .2s, box-shadow .2s;
  }
  .captcha-canvas:hover{border-color:var(--minion-yellow);box-shadow:0 0 0 4px rgba(255,217,15,.22)}
  .captcha-refresh{
    position:absolute;right:-6px;top:-8px;width:24px;height:24px;border:none;
    border-radius:50%;background:var(--minion-yellow);color:#5a4500;font-size:.72rem;
    line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 8px rgba(150,120,0,.35);transition:transform .25s;
  }
  .captcha-refresh:hover{transform:rotate(180deg) scale(1.12)}
  .captcha-error{margin:-12px 4px 14px}

  .remember{
    display:flex;align-items:center;justify-content:space-between;
    font-size:.85rem;color:var(--soft);margin:0 2px 18px;
  }
  .remember label{display:flex;align-items:center;gap:6px;cursor:pointer}
  .remember input{accent-color:var(--minion-yellow-dark);width:16px;height:16px}
  .remember a{color:var(--minion-blue-dark);text-decoration:none}
  .remember a:hover{text-decoration:underline}

  .btn{
    width:100%;border:none;cursor:pointer;
    padding:15px;border-radius:18px;
    font-size:1.1rem;font-weight:bold;letter-spacing:2px;
    color:#5a4500;font-family:inherit;
    background:linear-gradient(180deg,var(--minion-yellow) 0%,var(--minion-yellow-dark) 100%);
    box-shadow:0 8px 0 #D9A800, 0 12px 18px rgba(217,168,0,.4);
    transition:transform .08s, box-shadow .08s;
  }
  .btn:active{
    transform:translateY(6px);
    box-shadow:0 2px 0 #D9A800, 0 4px 8px rgba(217,168,0,.4);
  }

  .register{
    text-align:center;margin-top:18px;font-size:.9rem;color:var(--soft);
  }
  .register a{color:var(--minion-blue-dark);text-decoration:none;font-weight:bold}
  .register a:hover{text-decoration:underline}

  .toast{
    position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(120px);
    background:var(--ink);color:#fff;padding:14px 26px;border-radius:30px;
    font-size:1rem;opacity:0;transition:all .35s cubic-bezier(.2,1.2,.4,1);
    z-index:99;box-shadow:0 10px 24px rgba(0,0,0,.3);white-space:nowrap;
  }
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  }
</style>
</head>

(function(){

  /* ============================================================
     一、长度规则

       密码：11 位以内

  var USERNAME_MIN = 11;
  var USERNAME_MAX = 13;
  var PASSWORD_MAX = 11;

  /* ============================================================

     ============================================================ */
  (function buildFloaties(){
    var NS = 'http://www.w3.org/2000/svg';
    var XLINK = 'http://www.w3.org/1999/xlink';
    var field = document.getElementById('bananaField');
    var bananaImg = document.getElementById('bananaImg');
    if (!field || !bananaImg) return;

    var COUNT = 34;

    /* 用 sin 做确定性伪随机，保证每次刷新布局相同、不闪动 */
    function prand(seed){
      var x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
      return x - Math.floor(x);
    }

    var frag = document.createDocumentFragment();

    for (var i = 0; i < COUNT; i++){
      var r1 = prand(i + 1),
          r2 = prand(i + 101),
          r3 = prand(i + 211),
          r4 = prand(i + 307),
          r5 = prand(i + 419);

      var h = 56 + Math.round(r1 * 96);           /* 高 56 ~ 152 px（竖长香蕉） */
      var opacity = (0.30 + r2 * 0.40).toFixed(2);/* 0.30 ~ 0.70 */

      var svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('class', 'floaty');
      svg.setAttribute('viewBox', '0 0 131 395');
      svg.setAttribute('aria-hidden', 'true');
      svg.setAttribute('focusable', 'false');

      svg.style.left = (r3 * 96).toFixed(2) + '%';
      svg.style.top = (r4 * 92).toFixed(2) + '%';
      svg.style.height = h + 'px';
      svg.style.width = Math.round(h * 131 / 395) + 'px';
      svg.style.opacity = opacity;
      svg.style.setProperty('--rot', Math.round(-60 + r5 * 120) + 'deg');
      svg.style.setProperty('--rise', Math.round(16 + r2 * 30) + 'px');
      svg.style.setProperty('--sway', Math.round(-14 + r1 * 28) + 'px');
      svg.style.animationDelay = (r3 * 7).toFixed(2) + 's';
      svg.style.animationDuration = (5 + r4 * 5).toFixed(2) + 's';

      /* 引用 defs 里定义的照片香蕉（data URI 只存一份） */
      var use = document.createElementNS(NS, 'use');
      use.setAttribute('href', '#bananaImg');
      use.setAttributeNS(XLINK, 'xlink:href', '#bananaImg');
      use.setAttribute('width', '131');
      use.setAttribute('height', '395');
      svg.appendChild(use);
      frag.appendChild(svg);
    }

    field.appendChild(frag);
  })();

  /* ============================================================
     三、图形验证码（Canvas 绘制，点击可刷新）
     ============================================================ */
  var captchaCode = '';
  var canvas = document.getElementById('captchaCanvas');
  var ctx = canvas.getContext('2d');
  var CW = 108, CH = 44;

  /* 去掉容易看混的 0 O o 1 l I */
  var CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

  function rand(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }

  function randomCode(len){
    var s = '';
    for (var i = 0; i < len; i++) s += CHARS[Math.floor(Math.random() * CHARS.length)];
    return s;
  }

  function drawCaptcha(){
    var dpr = window.devicePixelRatio || 1;
    canvas.width = CW * dpr;
    canvas.height = CH * dpr;
    canvas.style.width = CW + 'px';
    canvas.style.height = CH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    /* 底色：淡香蕉黄 */
    var bg = ctx.createLinearGradient(0, 0, CW, CH);
    bg.addColorStop(0, '#FFFDF0');
    bg.addColorStop(.5, '#FFF3BD');
    bg.addColorStop(1, '#FFE894');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, CW, CH);

    /* 干扰点 */
    for (var i = 0; i < 56; i++){
      ctx.fillStyle = 'rgba(' + rand(120,210) + ',' + rand(110,190) + ',' + rand(20,110) + ',' +
                      (0.15 + Math.random() * 0.3).toFixed(2) + ')';
      ctx.beginPath();
      ctx.arc(rand(0, CW), rand(0, CH), Math.random() * 1.6 + 0.5, 0, Math.PI * 2);
      ctx.fill();
    }

    /* 干扰线 */
    for (var j = 0; j < 4; j++){
      ctx.strokeStyle = 'rgba(' + rand(150,220) + ',' + rand(130,190) + ',' + rand(30,120) + ',0.5)';
      ctx.lineWidth = rand(1, 2);
      ctx.beginPath();
      ctx.moveTo(rand(0, CW), rand(0, CH));
      ctx.quadraticCurveTo(rand(0, CW), rand(0, CH), rand(0, CW), rand(0, CH));
      ctx.stroke();
    }

    /* 字符：逐个旋转、错位，颜色随机 */
    var step = CW / (captchaCode.length + 0.5);
    var colors = ['#8A6A00', '#3B6FE0', '#C17800', '#2A55B8'];

    for (var k = 0; k < captchaCode.length; k++){
      var ch = captchaCode[k];
      var fontSize = rand(23, 29);
      var x = step * (k + 0.68);
      var y = CH / 2 + rand(-3, 4);
      var angle = rand(-26, 26) * Math.PI / 180;

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.font = 'bold ' + fontSize + 'px "Comic Sans MS","Segoe UI",Arial,sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      /* 影子 */
      ctx.fillStyle = 'rgba(120,90,0,.18)';
      ctx.fillText(ch, 1.4, 1.6);

      ctx.fillStyle = colors[rand(0, 3)];
      ctx.fillText(ch, 0, 0);
      ctx.restore();
    }

    /* 前景弧线，进一步干扰识别 */
    for (var m = 0; m < 2; m++){
      ctx.strokeStyle = 'rgba(255,217,15,.75)';
      ctx.lineWidth = rand(1, 2);
      ctx.beginPath();
      ctx.moveTo(rand(0, CW / 3), rand(0, CH));
      ctx.quadraticCurveTo(CW / 2, rand(-6, CH + 6), CW - rand(0, CW / 3), rand(0, CH));
      ctx.stroke();
    }
  }

  function refreshCaptcha(){
    captchaCode = randomCode(4);
    drawCaptcha();
    var input = document.getElementById('captcha');
    input.value = '';
    input.setAttribute('aria-invalid', 'false');
    hideError('captchaError');
  }

  /* 校验：忽略大小写与首尾空格 */
  function validateCaptcha(input){
    var v = (input || '').trim().toUpperCase();
    return v.length > 0 && v === captchaCode.toUpperCase();
  }

  canvas.addEventListener('click', refreshCaptcha);
  document.getElementById('captchaRefresh').addEventListener('click', refreshCaptcha);
  if (window.devicePixelRatio && window.matchMedia) {
    window.matchMedia('(resolution: ' + window.devicePixelRatio + 'dppx)')
      .addEventListener('change', drawCaptcha);
  }

  /* ============================================================
     四、表单校验
     ============================================================ */
  var usernameEl = document.getElementById('username');
  var passwordEl = document.getElementById('password');
  var captchaEl = document.getElementById('captcha');
  var userCounter = document.getElementById('usernameCounter');
  var passCounter = document.getElementById('passwordCounter');

  function showError(id, msg){
    var el = document.getElementById(id);
    el.textContent = msg;
    el.hidden = false;
  }
  function hideError(id){
    var el = document.getElementById(id);
    el.textContent = '';
    el.hidden = true;
  }

  /* 账号：只允许数字，且最多 13 位 */
  function onUsernameInput(){
    var digits = usernameEl.value.replace(/\D/g, '').slice(0, USERNAME_MAX);
    if (digits !== usernameEl.value) usernameEl.value = digits;

    var n = digits.length;
    userCounter.textContent = n + '/' + USERNAME_MAX;
    userCounter.classList.toggle('warn', n > 0 && n < USERNAME_MIN);

    if (n > 0) hideError('usernameError');
    usernameEl.setAttribute('aria-invalid', 'false');
  }

  usernameEl.addEventListener('input', onUsernameInput);
  passwordEl.addEventListener('input', function(){
    var n = passwordEl.value.length;
    passCounter.textContent = n + '/' + PASSWORD_MAX;
    passCounter.classList.toggle('warn', n > PASSWORD_MAX);
    if (n > 0) hideError('passwordError');
    passwordEl.setAttribute('aria-invalid', 'false');
  });
  captchaEl.addEventListener('input', function(){
    captchaEl.value = captchaEl.value.replace(/[^A-Za-z0-9]/g, '').slice(0, 4);
    if (captchaEl.value) hideError('captchaError');
    captchaEl.setAttribute('aria-invalid', 'false');
  });

  function validate(){
    var ok = true;

    /* 账号：11 ~ 13 位数字 */
    var u = usernameEl.value.trim();
    if (!u){
      showError('usernameError', '请输入账号');
      usernameEl.setAttribute('aria-invalid', 'true');
      ok = false;
    } else if (!/^\d+$/.test(u)){
      showError('usernameError', '账号只能是数字');
      usernameEl.setAttribute('aria-invalid', 'true');
      ok = false;
    } else if (u.length < USERNAME_MIN){
      showError('usernameError', '账号长度为 ' + USERNAME_MIN + '~' + USERNAME_MAX +
                                ' 位，还差 ' + (USERNAME_MIN - u.length) + ' 位');
      usernameEl.setAttribute('aria-invalid', 'true');
      ok = false;
    } else if (u.length > USERNAME_MAX){
      showError('usernameError', '账号长度不能超过 ' + USERNAME_MAX + ' 位');
      usernameEl.setAttribute('aria-invalid', 'true');
      ok = false;
    }

    /* 密码：11 位以内 */
    var p = passwordEl.value;
    if (!p){
      showError('passwordError', '请输入密码');
      passwordEl.setAttribute('aria-invalid', 'true');
      ok = false;
    } else if (p.length > PASSWORD_MAX){
      showError('passwordError', '密码不能超过 ' + PASSWORD_MAX + ' 位，当前 ' + p.length + ' 位');
      passwordEl.setAttribute('aria-invalid', 'true');
      ok = false;
    }

    /* 验证码 */
    var c = captchaEl.value.trim();
    if (!c){
      showError('captchaError', '请输入验证码');
      captchaEl.setAttribute('aria-invalid', 'true');
      ok = false;
    } else if (!validateCaptcha(c)){
      showError('captchaError', '验证码不正确');
      captchaEl.setAttribute('aria-invalid', 'true');
      refreshCaptcha();
      ok = false;
    }

    return ok;
  }

  /* ============================================================
     五、显示/隐藏密码 & 提示气泡
     ============================================================ */
  var togglePass = document.getElementById('togglePass');
  function doToggle(){
    passwordEl.type = passwordEl.type === 'password' ? 'text' : 'password';
    togglePass.textContent = passwordEl.type === 'password' ? '👁️' : '🙈';
  }
  togglePass.addEventListener('click', doToggle);
  togglePass.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); doToggle(); }
  });

  var toast = document.getElementById('toast');
  var toastTimer;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2200);
  }

  /* ============================================================
     六、提交 & 其它交互
     ============================================================ */
  var form = document.getElementById('loginForm');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    if (!validate()) return;

    var u = usernameEl.value.trim();
    var remember = document.getElementById('remember').checked;

    if (remember){
      try { localStorage.setItem('minion:username', u); } catch (err) {}
    } else {
      try { localStorage.removeItem('minion:username'); } catch (err) {}
    }

    showToast('Bello, ' + u + '! 登录成功 🎉');

    /* 登录成功后换一张验证码，防止重复使用同一串 */
    refreshCaptcha();
  });

  document.getElementById('forgot').addEventListener('click', function(e){
    e.preventDefault(); showToast('别担心，香蕉能帮你找回密码 🍌');
  });
  document.getElementById('signup').addEventListener('click', function(e){
    e.preventDefault(); showToast('注册小黄人… Banana! 🍌🍌');
  });

  /* ============================================================
     七、初始化
     ============================================================ */
  refreshCaptcha();

  /* 记住我：回填上次的账号 */
  try {
    var saved = localStorage.getItem('minion:username');
    if (saved){
      usernameEl.value = saved.replace(/\D/g, '').slice(0, USERNAME_MAX);
      document.getElementById('remember').checked = true;
    }
  } catch (err) {}
  onUsernameInput();
})();
</script>
