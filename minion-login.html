<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小黄人登录 · Minion Login</title>
<style>
  :root{
    --minion-yellow:#FFD90F;
    --minion-yellow-dark:#F5C400;
    --minion-blue:#3B6FE0;
    --minion-blue-dark:#2A55B8;
    --ink:#3A3A3A;
    --soft:#7A7A7A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Comic Sans MS","Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 20% 20%, #FFF4B8 0%, transparent 40%),
      radial-gradient(circle at 80% 80%, #FFF4B8 0%, transparent 40%),
      linear-gradient(160deg,#FFE873 0%,#FFD90F 55%,#F7C200 100%);
    overflow:hidden;
    position:relative;
  }
  /* floating bananas */
  .floaty{position:absolute;font-size:2rem;opacity:.35;animation:bob 6s ease-in-out infinite;user-select:none;pointer-events:none}
  .floaty:nth-child(1){top:12%;left:8%;animation-delay:0s}
  .floaty:nth-child(2){top:70%;left:15%;animation-delay:1.2s;font-size:2.6rem}
  .floaty:nth-child(3){top:20%;right:10%;animation-delay:2s}
  .floaty:nth-child(4){bottom:12%;right:14%;animation-delay:.6s;font-size:1.8rem}
  .floaty:nth-child(5){top:50%;left:6%;animation-delay:3s;font-size:1.6rem}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-22px) rotate(8deg)}}

  .card{
    position:relative;
    width:360px;
    max-width:92vw;
    background:#fff;
    border-radius:32px;
    padding:0 0 34px;
    box-shadow:0 24px 60px rgba(120,90,0,.28);
    z-index:2;
    overflow:hidden;
    animation:pop .6s cubic-bezier(.2,1.2,.4,1) both;
  }
  @keyframes pop{from{opacity:0;transform:translateY(40px) scale(.92)}to{opacity:1;transform:none}}

  .card-top{
    background:linear-gradient(180deg,var(--minion-blue) 0%,var(--minion-blue-dark) 100%);
    padding:22px 0 14px;
    text-align:center;
    position:relative;
  }
  .card-top::after{
    content:"";position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);
    width:108%;height:30px;background:var(--minion-blue);
    border-radius:50%;
  }

  /* ---------- MINION SVG ---------- */
  .minion{
    width:150px;height:150px;margin:0 auto;display:block;
    filter:drop-shadow(0 8px 10px rgba(0,0,0,.18));
    animation:bob 4s ease-in-out infinite;
  }
  .goggle-eye{transition:transform .12s ease-out;transform-origin:center}
  .minion:hover{animation-play-state:paused}

  .title{
    text-align:center;
    margin:18px 0 4px;
    color:var(--ink);
    font-size:1.5rem;
    letter-spacing:1px;
  }
  .subtitle{
    text-align:center;color:var(--soft);
    font-size:.9rem;margin-bottom:18px;
  }
  .subtitle b{color:var(--minion-blue-dark)}

  form{padding:0 30px}
  .field{
    position:relative;margin-bottom:16px;
  }
  .field input{
    width:100%;
    padding:14px 44px 14px 16px;
    border:2px solid #ECECEC;
    border-radius:16px;
    font-size:1rem;
    color:var(--ink);
    background:#FBFBFB;
    transition:border-color .2s, box-shadow .2s;
    outline:none;
  }
  .field input:focus{
    border-color:var(--minion-yellow);
    box-shadow:0 0 0 4px rgba(255,217,15,.25);
    background:#fff;
  }
  .field .icon{
    position:absolute;right:14px;top:50%;transform:translateY(-50%);
    font-size:1.2rem;cursor:pointer;user-select:none;
  }
  .toggle-pass:hover{transform:translateY(-50%) scale(1.15)}

  .remember{
    display:flex;align-items:center;justify-content:space-between;
    font-size:.85rem;color:var(--soft);margin:-2px 2px 18px;
  }
  .remember label{display:flex;align-items:center;gap:6px;cursor:pointer}
  .remember input{accent-color:var(--minion-yellow-dark);width:16px;height:16px}
  .remember a{color:var(--minion-blue-dark);text-decoration:none}
  .remember a:hover{text-decoration:underline}

  .btn{
    width:100%;border:none;cursor:pointer;
    padding:15px;border-radius:18px;
    font-size:1.1rem;font-weight:bold;letter-spacing:2px;
    color:#5a4500;
    background:linear-gradient(180deg,var(--minion-yellow) 0%,var(--minion-yellow-dark) 100%);
    box-shadow:0 8px 0 #D9A800, 0 12px 18px rgba(217,168,0,.4);
    transition:transform .08s, box-shadow .08s;
  }
  .btn:active{
    transform:translateY(6px);
    box-shadow:0 2px 0 #D9A800, 0 4px 8px rgba(217,168,0,.4);
  }

  .register{
    text-align:center;margin-top:18px;font-size:.9rem;color:var(--soft);
  }
  .register a{color:var(--minion-blue-dark);text-decoration:none;font-weight:bold}
  .register a:hover{text-decoration:underline}

  .toast{
    position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(120px);
    background:var(--ink);color:#fff;padding:14px 26px;border-radius:30px;
    font-size:1rem;opacity:0;transition:all .35s cubic-bezier(.2,1.2,.4,1);
    z-index:99;box-shadow:0 10px 24px rgba(0,0,0,.3);white-space:nowrap;
  }
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>
  <div class="floaty">🍌</div>
  <div class="floaty">🍌</div>
  <div class="floaty">🍌</div>
  <div class="floaty">🍌</div>
  <div class="floaty">🍌</div>

  <div class="card">
    <div class="card-top">
      <!-- Minion SVG -->
      <svg class="minion" viewBox="0 0 200 200" id="minionSvg" aria-hidden="true">
        <!-- body -->
        <ellipse cx="100" cy="120" rx="62" ry="70" fill="#FFD90F" stroke="#E0B600" stroke-width="3"/>
        <!-- overalls top -->
        <path d="M48 120 Q100 95 152 120 L150 150 Q100 132 50 150 Z" fill="#3B6FE0"/>
        <!-- strap left -->
        <rect x="62" y="92" width="10" height="40" rx="4" fill="#3B6FE0"/>
        <!-- strap right -->
        <rect x="128" y="92" width="10" height="40" rx="4" fill="#3B6FE0"/>
        <!-- center button -->
        <circle cx="100" cy="128" r="6" fill="#2A55B8"/>
        <!-- pocket -->
        <rect x="84" y="140" width="32" height="22" rx="4" fill="#2A55B8"/>
        <!-- arms -->
        <path d="M40 128 q-16 10 -14 34" stroke="#FFD90F" stroke-width="14" fill="none" stroke-linecap="round"/>
        <path d="M160 128 q16 10 14 34" stroke="#FFD90F" stroke-width="14" fill="none" stroke-linecap="round"/>
        <!-- gloves -->
        <circle cx="25" cy="164" r="11" fill="#3A3A3A"/>
        <circle cx="175" cy="164" r="11" fill="#3A3A3A"/>
        <!-- legs -->
        <rect x="78" y="182" width="16" height="16" rx="6" fill="#3A3A3A"/>
        <rect x="106" y="182" width="16" height="16" rx="6" fill="#3A3A3A"/>
        <!-- goggle band -->
        <rect x="40" y="62" width="120" height="14" rx="7" fill="#5a5a5a"/>
        <!-- left goggle -->
        <g class="goggle-eye" data-eye="left">
          <circle cx="76" cy="74" r="30" fill="#e8e8e8" stroke="#5a5a5a" stroke-width="4"/>
          <circle cx="76" cy="74" r="22" fill="#fff"/>
          <circle cx="76" cy="74" r="11" fill="#6b4a2b"/>
          <circle cx="76" cy="74" r="5" fill="#1a1a1a"/>
          <circle cx="71" cy="69" r="3" fill="#fff"/>
        </g>
        <!-- right goggle -->
        <g class="goggle-eye" data-eye="right">
          <circle cx="124" cy="74" r="30" fill="#e8e8e8" stroke="#5a5a5a" stroke-width="4"/>
          <circle cx="124" cy="74" r="22" fill="#fff"/>
          <circle cx="124" cy="74" r="11" fill="#6b4a2b"/>
          <circle cx="124" cy="74" r="5" fill="#1a1a1a"/>
          <circle cx="119" cy="69" r="3" fill="#fff"/>
        </g>
        <!-- hair -->
        <path d="M86 48 q4 -14 8 0" stroke="#3A3A3A" stroke-width="3" fill="none"/>
        <path d="M98 44 q4 -16 8 0" stroke="#3A3A3A" stroke-width="3" fill="none"/>
        <path d="M110 48 q4 -14 8 0" stroke="#3A3A3A" stroke-width="3" fill="none"/>
        <!-- mouth -->
        <path d="M88 108 q12 10 24 0" stroke="#7a5a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <h1 class="title">小黄人登录</h1>
    <p class="subtitle">说 <b>"Bello!"</b> 然后进来玩吧 🍌</p>

    <form id="loginForm" autocomplete="off">
      <div class="field">
        <input type="text" id="username" placeholder="香蕉账号 / 用户名" required>
        <span class="icon">🍌</span>
      </div>
      <div class="field">
        <input type="password" id="password" placeholder="密码（别告诉格鲁！）" required>
        <span class="icon toggle-pass" id="togglePass" title="显示/隐藏密码">👁️</span>
      </div>
      <div class="remember">
        <label><input type="checkbox" id="remember"> 记住我</label>
        <a href="#" id="forgot">忘记密码？</a>
      </div>
      <button type="submit" class="btn">登 录 🍌</button>
    </form>

    <p class="register">还没有账号？ <a href="#" id="signup">注册一个小黄人</a></p>
  </div>

  <div class="toast" id="toast"></div>

<script>
  // 眼睛跟随鼠标
  const eyes = document.querySelectorAll('.goggle-eye');
  document.addEventListener('mousemove', (e)=>{
    eyes.forEach(g=>{
      const r = g.getBoundingClientRect();
      const cx = r.left + r.width/2;
      const cy = r.top + r.height/2;
      const dx = e.clientX - cx;
      const dy = e.clientY - cy;
      const ang = Math.atan2(dy,dx);
      const dist = Math.min(6, Math.hypot(dx,dy)/20);
      g.style.transform = `translate(${Math.cos(ang)*dist}px, ${Math.sin(ang)*dist}px)`;
    });
  });

  // 显示/隐藏密码
  const pass = document.getElementById('password');
  document.getElementById('togglePass').addEventListener('click', ()=>{
    pass.type = pass.type === 'password' ? 'text' : 'password';
  });

  // 提示气泡
  const toast = document.getElementById('toast');
  let toastTimer;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toast.classList.remove('show'), 2200);
  }

  // 登录提交
  document.getElementById('loginForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;
    if(!u || !p){ showToast('🍌 喂！账号和密码都要填哦～'); return; }
    showToast(`Bello, ${u}! 登录成功 🎉`);
  });

  document.getElementById('forgot').addEventListener('click', e=>{
    e.preventDefault(); showToast('别担心，香蕉能帮你找回密码 🍌');
  });
  document.getElementById('signup').addEventListener('click', e=>{
    e.preventDefault(); showToast('注册小黄人… Banana! 🍌🍌');
  });
</script>
</body>
</html>
